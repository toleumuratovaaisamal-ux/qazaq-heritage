<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qazaq Heritage - Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <img src="images/logo.png" alt="Logo" width="30" height="30" class="d-inline-block align-text-top me-2">
                Qazaq Heritage
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-lg-2">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="heritage.html">Heritage</a></li>
                    <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-5" style="max-width: 600px;">
        <h2 class="fw-bold mb-4 text-center">Contact Us & Register</h2>
        
        <!-- Task 1: Form Validation -->
        <form id="contactForm" novalidate class="p-4 border rounded bg-white shadow-sm">
            <div class="mb-3">
                <label for="fullName" class="form-label fw-semibold">Full Name</label>
                <input type="text" class="form-control" id="fullName" placeholder="Enter your full name">
                <div class="invalid-feedback"></div>
            </div>

            <div class="mb-3">
                <label for="emailAddress" class="form-label fw-semibold">Email address</label>
                <input type="email" class="form-control" id="emailAddress" placeholder="name@example.com">
                <div class="invalid-feedback"></div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Minimum 6 characters">
                <div class="invalid-feedback"></div>
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password">
                <div class="invalid-feedback"></div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-2">Submit</button>
        </form>
    </main>

    <!-- Dynamic Date/Time & Color Switcher -->
    <div class="text-center py-3 bg-light border-top">
        <p class="mb-2 text-muted">Current Date & Time: <span id="dateTimeDisplay" class="fw-bold"></span></p>
        <button id="changeBgBtn" class="btn btn-outline-secondary btn-sm">Change Theme Color</button>
    </div>

    <!-- Footer -->
    <footer class="py-4 bg-dark text-white text-center">
        <div class="container">
            <p class="mb-0">&copy; 2026 Qazaq Heritage. Group SE-2504.</p>
            <small class="text-white-50">Created by Toleumuratova Aisamal and Absultanov Nurdaulet</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
